name: Beat Mania CI Gate v1

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (must produce dist/index.html)
        run: npm run build

      - name: Assert build artifact exists
        run: node -e "require('fs').accessSync('dist/index.html')"

      - name: Engine verification (required / fail-closed)
        run: |
          node -e "const p=require('./package.json'); if(!p.scripts || !p.scripts['engine:verify']) { console.error('engine:verify not defined -> FAIL CLOSED'); process.exit(1) }"
          npm run engine:verify
